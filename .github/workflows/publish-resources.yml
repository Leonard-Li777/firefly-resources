name: publish-resources

on:
  workflow_dispatch:
    inputs:
      resourceIds:
        description: '逗号分隔的资源 ID（或 all = 全部可自动发布资源；不存在的 ID 会直接失败）'
        required: true
        default: 'all'
      version:
        description: '可选：指定版本（仅单个资源可用；留空取 index 当前版本）'
        required: false
        default: ''
      keep:
        description: '历史版本保留数（默认 2 = 当前最新 + 上一版；0 = 不裁剪）'
        required: false
        default: '2'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Publish resources
        run: |
          node publish-resources.js --upstream "${{ inputs.resourceIds }}" \
            --version "${{ inputs.version }}" --keep "${{ inputs.keep }}"
        shell: bash
        env:
          # 仓库已转私有：gh CLI 需显式 token（优先长期 PAT，回退 Actions 默认 token——对本仓库仍有写权限）
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

    # --upstream 语义：按 sources/<id>.json 的上游规则，以 index 中的当前版本重新拉取资产并归档发布，
    # 用于「远端资产缺失/漂移对账重发」；新版本的生产仍由各资源自己的构建流水线驱动。
    # all 模式只发布「在线 + 声明了 platforms/assetMap + 非 deprecated」的子集，其余逐个打印跳过原因。
    # 显式指定资源时不允许静默跳过：sources 缺失、上游不可自动发布、无法确定版本一律失败退出。
